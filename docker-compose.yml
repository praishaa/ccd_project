services:
  db:
    image: postgres:16
    container_name: blood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blood
      POSTGRES_PASSWORD: bloodpass
      POSTGRES_DB: blooddb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
